name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run canonical credential-free portfolio checks
        run: bash scripts/check_portfolio.sh

      - name: Build the webhook lab image
        working-directory: cases/ecommerce-webhook-lab
        run: docker compose build --pull

      - name: Check local links, interactive assets and repository hygiene
        run: |
          python scripts/check_local_links.py
          python scripts/check_html_assets.py
          ! find . -type f \( -name '*.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep .
          git diff --check
