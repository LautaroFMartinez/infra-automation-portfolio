name: Portfolio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python examples
        run: python -m py_compile cases/backup-verification/verify_archive.py cases/monitoring-stack/healthcheck.py

      - name: Validate mock JSON
        run: python -m json.tool cases/n8n-api-automation/mock_payload.json >/dev/null

      - name: Check shell syntax
        run: bash -n cases/linux-docker-audit/audit.sh

      - name: Check Markdown links and repository hygiene
        run: |
          ! find . -type f \( -name '*.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep .
          git diff --check
